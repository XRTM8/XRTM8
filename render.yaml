# NEON CLASH: OVERDRIVE — Render Static Site Deployment
# Deploy: Render Dashboard → New → Blueprint (or read this repo directly).
# Static sites on the free plan never sleep and get automatic HTTPS.

services:
  - type: web
    name: neon-clash-overdrive
    runtime: static
    staticPublishPath: .
    routes:
      # SPA-style fallback so deep links (e.g. /?room=ABCD) always load the game
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Game assets are fingerprinted by the service worker; allow long caching
      - path: /js
        name: Cache-Control
        value: public, max-age=604800
      - path: /css
        name: Cache-Control
        value: public, max-age=604800
      - path: /icons
        name: Cache-Control
        value: public, max-age=2592000
      # Service worker must always be re-validated so updates ship immediately
      - path: /service-worker.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
