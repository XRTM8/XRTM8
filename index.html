<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>مصنع — إمبراطورية السيارات</title>
<style>
:root{--bg:#0f1419;--panel:#1a2029;--panel2:#222a35;--line:#2c3644;--text:#e6ebf0;--muted:#8a97a8;--acc:#f5b400;--acc2:#3fa9f5;--good:#37c871;--bad:#ef5350;--r:12px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Segoe UI",Tahoma,system-ui,sans-serif;font-size:15px;overscroll-behavior:none}
body{display:flex;flex-direction:column}
button{font-family:inherit;font-size:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 14px;background:var(--panel2);color:var(--text);transition:.12s}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);color:#111;font-weight:700}
button.blue{background:var(--acc2);color:#031}
button.danger{background:var(--bad);color:#fff}
button.sm{padding:6px 10px;font-size:13px}
button:disabled{opacity:.4;cursor:not-allowed}
select,input[type=text],input[type=number]{font-family:inherit;font-size:15px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
input[type=range]{width:100%;accent-color:var(--acc)}
h1,h2,h3{margin:0 0 8px}
h2{font-size:18px;color:var(--acc)}
h3{font-size:15px;color:#cbd5e1}
.muted{color:var(--muted);font-size:13px}
.good{color:var(--good)}.bad{color:var(--bad)}.acc{color:var(--acc)}
#top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;padding-top:calc(8px + env(safe-area-inset-top))}
#top .co{font-weight:700;font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .stat{font-size:13px;white-space:nowrap}
#top .stat b{display:block;font-size:14px}
#main{flex:1;overflow-y:auto;padding:12px;padding-bottom:calc(140px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
#tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--panel);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5;overflow-x:auto}
#tabs button{flex:1;min-width:64px;border-radius:0;background:transparent;color:var(--muted);padding:8px 4px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px}
#tabs button .ic{font-size:20px}
#tabs button.on{color:var(--acc)}
#endturn{position:fixed;right:12px;left:12px;bottom:calc(66px + env(safe-area-inset-bottom));z-index:5;padding:14px;font-size:17px;font-weight:800;border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.4);background:linear-gradient(135deg,#f5b400,#f58a00);color:#111}
#endturn .sub{display:block;font-size:12px;font-weight:400;opacity:.8}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row>*{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed #2a3340;font-size:14px}
.kv:last-child{border:0}
.bar{height:8px;background:#0b0f14;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc2);border-radius:5px;transition:.3s}
.statrow{display:grid;grid-template-columns:64px 1fr 34px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--panel2);font-size:12px;margin:2px}
.tag.on{background:var(--acc);color:#111}
.news{padding:8px 10px;border-right:3px solid var(--muted);background:var(--panel2);border-radius:6px;margin-bottom:6px;font-size:13px}
.news.good{border-color:var(--good)}.news.bad{border-color:var(--bad)}.news.event{border-color:var(--acc)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--acc);border-radius:16px;padding:18px;max-width:460px;width:100%;max-height:90vh;overflow-y:auto}
.modal .box button{width:100%;margin-top:8px;text-align:right}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:20px;z-index:60;font-size:14px;pointer-events:none;animation:fade 2.6s forwards;max-width:90vw;text-align:center}
@keyframes fade{0%{opacity:0;transform:translate(-50%,-10px)}10%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
canvas.car{width:100%;height:auto;background:linear-gradient(#182029,#0b0f14);border-radius:10px;border:1px solid var(--line)}
.colors{display:flex;gap:6px;flex-wrap:wrap}
.colors span{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.colors span.on{border-color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:right}
th{color:var(--muted);font-weight:400}
.chart{width:100%;height:120px;background:#0b0f14;border-radius:8px}
#menu{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px;background:radial-gradient(ellipse at top,#1d2733,#0f1419 70%)}
#menu h1{font-size:44px;color:var(--acc);letter-spacing:2px;text-shadow:0 4px 30px #f5b40055}
#menu .card{width:100%;max-width:420px;text-align:right}
.model{display:flex;gap:10px;align-items:center}
.model canvas{width:110px;height:55px;flex:none;border-radius:8px;background:#0b0f14}
.pill{font-size:12px;padding:3px 8px;border-radius:12px;background:#0b0f14;color:var(--muted)}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;padding:8px 4px;font-size:12px}
.seg button.on{background:var(--acc);color:#111;font-weight:700}
.tech{padding:10px;border-radius:10px;background:var(--panel2);margin-bottom:8px;border:1px solid transparent}
.tech.done{border-color:var(--good);opacity:.7}
.tech.locked{opacity:.45}
.tech.active{border-color:var(--acc)}
.summary td{font-size:14px}
</style>
</head>
<body>

<div id="menu">
  <div style="font-size:60px">🏭</div>
  <h1>مصنع</h1>
  <div class="muted" style="font-size:15px">أسّس شركة سيارات من الصفر. صمّم، صنّع، وتنافس عالمياً من 1960 حتى 2030.</div>
  <div class="card">
    <h3>شركة جديدة</h3>
    <input type="text" id="mCompany" placeholder="اسم الشركة" maxlength="20" value="">
    <div style="height:8px"></div>
    <div class="muted">المقر الرئيسي</div>
    <select id="mHome"></select>
    <div style="height:8px"></div>
    <div class="muted">الصعوبة</div>
    <div class="seg" id="mDiff">
      <button data-v="easy">سهل</button><button data-v="normal" class="on">عادي</button><button data-v="hard">صعب</button>
    </div>
    <div style="height:12px"></div>
    <button class="pri" style="width:100%" onclick="startNew()">🚗 تأسيس الشركة</button>
    <button id="mContinue" style="width:100%;margin-top:8px;display:none" onclick="continueGame()">▶ متابعة اللعبة المحفوظة</button>
    <button style="width:100%;margin-top:8px" onclick="showLeaderboard()">🏆 المتصدرون عالمياً</button>
  </div>
  <div class="muted">يعمل بدون إنترنت • حفظ تلقائي • مجاني بالكامل</div>
</div>

<div id="game" style="display:none;flex-direction:column;height:100%">
  <div id="top">
    <div class="co" id="tCo"></div>
    <div class="stat"><span class="muted">📅</span><b id="tDate"></b></div>
    <div class="stat"><span class="muted">💰</span><b id="tCash"></b></div>
    <div class="stat"><span class="muted">⭐</span><b id="tBrand"></b></div>
  </div>
  <div id="main"></div>
  <button id="endturn" onclick="doEndTurn()">⏭ إنهاء الربع <span class="sub" id="etSub"></span></button>
  <div id="tabs">
    <button data-t="dash"><span class="ic">📊</span>الرئيسية</button>
    <button data-t="design"><span class="ic">✏️</span>تصميم</button>
    <button data-t="models"><span class="ic">🚗</span>موديلات</button>
    <button data-t="factory"><span class="ic">🏭</span>مصانع</button>
    <button data-t="market"><span class="ic">🌍</span>السوق</button>
    <button data-t="rnd"><span class="ic">🔬</span>بحث</button>
    <button data-t="finance"><span class="ic">🏦</span>مالية</button>
  </div>
</div>

<div id="modals"></div>

<script src="engine.js"></script>
<script>
'use strict';
const M = Masna3;
let G = null, tab = 'dash';
const $ = (s) => document.querySelector(s);
const fm = M.fmtMoney;
const fn = (n) => Math.round(n).toLocaleString('en-US');
const SAVE_KEY = 'masna3_save_v1';
const PID_KEY = 'masna3_pid';
let playerId = localStorage.getItem(PID_KEY); if (!playerId) { playerId = 'p' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); localStorage.setItem(PID_KEY, playerId); }

// ---------- MENU ----------
(function initMenu() {
  const sel = $('#mHome'); for (const r in M.REGIONS) { const o = document.createElement('option'); o.value = r; o.textContent = M.REGIONS[r].name; sel.appendChild(o); } sel.value = 'me';
  $('#mDiff').onclick = (e) => { if (e.target.dataset.v) { [...$('#mDiff').children].forEach(b => b.classList.remove('on')); e.target.classList.add('on'); } };
  if (localStorage.getItem(SAVE_KEY)) $('#mContinue').style.display = 'block';
  $('#tabs').onclick = (e) => { const b = e.target.closest('button'); if (b) { tab = b.dataset.t; render(); } };
})();
function startNew() {
  const name = $('#mCompany').value.trim() || 'شركتي';
  G = M.newGame({ companyName: name, home: $('#mHome').value, difficulty: $('#mDiff').querySelector('.on').dataset.v });
  tab = 'design'; enterGame();
  modal({ title: 'مرحباً بك يا مدير!', text: `لديك ${fm(G.cash)} ومصنع واحد. هدفك: بناء أقوى شركة سيارات في العالم بحلول 2030.<br><br>💡 <b>نصيحة:</b> ابدأ بسيارة بسيطة ورخيصة تناسب سوقك المحلي. لا تبالغ بالسعر — المشتري ذكي.`, choices: [{ label: 'لنبدأ!' }] });
}
function continueGame() { try { G = JSON.parse(localStorage.getItem(SAVE_KEY)); tab = 'dash'; enterGame(); } catch (e) { toast('الحفظ تالف'); } }
function enterGame() { $('#menu').style.display = 'none'; $('#game').style.display = 'flex'; render(); }
function save() { if (!G) return; localStorage.setItem(SAVE_KEY, JSON.stringify(G)); cloudSave(); }
let cloudTimer;
function cloudSave() { clearTimeout(cloudTimer); cloudTimer = setTimeout(() => { fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ playerId, game: G, meta: { company: G.companyName, value: Math.round(M.companyValue(G)), year: G.year, sold: G.stats.totalSold, finished: G.gameOver } }) }).catch(() => {}); }, 1500); }
async function showLeaderboard() {
  let html = '<div class="muted">جاري التحميل...</div>';
  const m = modal({ title: '🏆 أعلى قيمة شركة', html, choices: [{ label: 'إغلاق' }] });
  try { const r = await (await fetch('/api/leaderboard')).json(); html = '<table><tr><th>#</th><th>الشركة</th><th>القيمة</th><th>السنة</th></tr>' + r.rows.map((x, i) => `<tr><td>${i + 1}</td><td>${esc(x.company)}</td><td>${fm(x.value)}</td><td>${x.year}${x.finished ? ' ✅' : ''}</td></tr>`).join('') + '</table>' + (r.rows.length ? '' : '<div class="muted">لا أحد بعد. كن الأول!</div>'); }
  catch (e) { html = '<div class="bad">تعذر الاتصال بالسيرفر (تعمل بدون إنترنت)</div>'; }
  m.querySelector('.mbody').innerHTML = html;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

// ---------- UI HELPERS ----------
function toast(t) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2700); }
function modal(o) {
  const w = document.createElement('div'); w.className = 'modal';
  w.innerHTML = `<div class="box"><h2>${o.title || ''}</h2><div class="mbody">${o.html || (o.text ? `<div style="line-height:1.7">${o.text}</div>` : '')}</div><div class="mch"></div></div>`;
  const ch = w.querySelector('.mch');
  (o.choices || [{ label: 'حسناً' }]).forEach((c, i) => { const b = document.createElement('button'); b.className = c.cls || (i === 0 ? 'pri' : ''); b.innerHTML = c.label; b.onclick = () => { w.remove(); c.fn && c.fn(); }; ch.appendChild(b); });
  $('#modals').appendChild(w); return w;
}
function act(res, okMsg) { if (!res.ok) { toast('❌ ' + res.error); return false; } if (okMsg) toast(okMsg); save(); render(); return true; }
function statRow(label, v, max, color) { return `<div class="statrow"><span class="muted">${label}</span><div class="bar"><i style="width:${Math.min(100, v / max * 100)}%;background:${color || 'var(--acc2)'}"></i></div><b>${typeof v === 'number' && v % 1 ? v.toFixed(1) : v}</b></div>`; }
const STAT_LABELS = { perf: 'أداء', eco: 'اقتصاد', comfort: 'راحة', safety: 'سلامة', rel: 'موثوقية', prestige: 'هيبة', space: 'مساحة' };
function specBars(s) { return statRow('أداء', s.perf, 10) + statRow('اقتصاد', s.eco, 10, '#37c871') + statRow('راحة', s.comfort, 10, '#a78bfa') + statRow('سلامة', s.safety, 10, '#f59e0b') + statRow('موثوقية', s.rel, 100, '#3fa9f5') + statRow('هيبة', s.prestige, 10, '#f472b6'); }

// ---------- CAR DRAWING ----------
function drawCar(cv, body, color, opts) {
  opts = opts || {}; const W = cv.width = cv.clientWidth * 2 || 600, H = cv.height = Math.round(W / 2); const c = cv.getContext('2d');
  c.clearRect(0, 0, W, H); c.save(); c.scale(W / 600, H / 300);
  // ground
  c.fillStyle = '#0a0d11'; c.fillRect(0, 232, 600, 68); c.strokeStyle = '#26303c'; c.beginPath(); c.moveTo(0, 232); c.lineTo(600, 232); c.stroke();
  const P = { // silhouettes: [x,y] polygons (600x300 space)
    city:   [[110,215],[120,165],[165,120],[300,110],[370,120],[420,165],[440,215]],
    sedan:  [[70,215],[80,175],[150,165],[210,115],[350,110],[420,165],[520,175],[530,215]],
    wagon:  [[70,215],[80,175],[150,165],[210,115],[470,110],[490,165],[520,175],[530,215]],
    coupe:  [[60,215],[75,180],[170,168],[250,120],[360,118],[470,175],[540,185],[545,215]],
    pickup: [[60,215],[70,150],[300,150],[300,115],[400,112],[440,155],[540,160],[545,215]],
    van:    [[60,215],[62,110],[420,105],[490,130],[540,170],[545,215]],
    luxury: [[45,215],[55,170],[140,160],[200,115],[380,110],[450,160],[555,170],[560,215]],
    suv:    [[60,215],[65,150],[110,130],[180,105],[450,100],[500,140],[540,150],[545,215]],
    cross:  [[70,215],[75,160],[130,145],[200,110],[430,105],[480,145],[530,155],[535,215]],
    super:  [[40,220],[60,190],[180,175],[260,135],[360,132],[470,175],[560,192],[565,220]],
  }[body] || [[70,215],[80,175],[150,165],[210,115],[350,110],[420,165],[520,175],[530,215]];
  // shadow
  c.fillStyle = '#00000088'; c.beginPath(); c.ellipse(300, 236, 250, 12, 0, 0, Math.PI * 2); c.fill();
  // body
  const grad = c.createLinearGradient(0, 100, 0, 220); grad.addColorStop(0, lighten(color, 40)); grad.addColorStop(.5, color); grad.addColorStop(1, lighten(color, -40));
  c.fillStyle = grad; c.strokeStyle = lighten(color, -60); c.lineWidth = 3;
  c.beginPath(); P.forEach((p, i) => i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1])); c.closePath(); c.fill(); c.stroke();
  // windows: use the upper part of the silhouette (points with y<140)
  c.fillStyle = '#9ad3ff'; c.globalAlpha = .85; c.beginPath();
  const top = P.filter(p => p[1] <= 140); if (top.length >= 2) { const a = top[0], b = top[top.length - 1]; c.moveTo(a[0] + 15, 165); top.forEach(p => c.lineTo(p[0] + (p === a ? 20 : p === b ? -20 : 0), p[1] + 10)); c.lineTo(b[0] - 15, 165); c.closePath(); c.fill(); }
  c.globalAlpha = 1;
  // pillar
  c.strokeStyle = lighten(color, -30); c.lineWidth = 6; c.beginPath(); const mid = (top[0][0] + top[top.length - 1][0]) / 2; c.moveTo(mid, 120); c.lineTo(mid - 4, 166); c.stroke();
  // wheels
  const wl = body === 'super' || body === 'coupe' ? 150 : 140, wr = body === 'pickup' || body === 'van' ? 470 : 460;
  const R = body === 'suv' || body === 'pickup' ? 38 : body === 'cross' ? 34 : 32;
  for (const x of [wl, wr]) { c.fillStyle = '#111'; c.beginPath(); c.arc(x, 218, R, 0, 7); c.fill(); c.fillStyle = '#c8ced6'; c.beginPath(); c.arc(x, 218, R * .55, 0, 7); c.fill(); c.strokeStyle = '#555'; c.lineWidth = 3; for (let k = 0; k < 5; k++) { c.beginPath(); c.moveTo(x, 218); c.lineTo(x + Math.cos(k * 1.257) * R * .5, 218 + Math.sin(k * 1.257) * R * .5); c.stroke(); } }
  // lights (front is right side since RTL? keep front on left for standard look)
  c.fillStyle = '#fff5b0'; c.fillRect(P[0][0] + 2, 178, 16, 12); c.fillStyle = '#ff5b5b'; c.fillRect(P[P.length - 1][0] - 18, 178, 16, 12);
  // door line
  c.strokeStyle = lighten(color, -50); c.lineWidth = 2; c.beginPath(); c.moveTo(mid + 60, 170); c.lineTo(mid + 60, 212); c.stroke();
  if (opts.label) { c.fillStyle = '#e6ebf0'; c.font = 'bold 22px sans-serif'; c.textAlign = 'right'; c.fillText(opts.label, 585, 40); }
  c.restore();
}
function lighten(hex, amt) { const n = parseInt(hex.slice(1), 16); let r = (n >> 16) + amt, g = ((n >> 8) & 255) + amt, b = (n & 255) + amt; r = Math.max(0, Math.min(255, r)); g = Math.max(0, Math.min(255, g)); b = Math.max(0, Math.min(255, b)); return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0'); }

// ---------- RENDER ----------
function render() {
  if (!G) return;
  $('#tCo').textContent = G.companyName;
  $('#tDate').textContent = `Q${G.quarter} ${G.year}`;
  $('#tCash').textContent = fm(G.cash); $('#tCash').className = G.cash < 0 ? 'bad' : '';
  $('#tBrand').textContent = Math.round(G.brand);
  [...$('#tabs').children].forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  const et = $('#endturn'); et.style.display = G.gameOver ? 'none' : '';
  $('#etSub').textContent = G.events.length ? `⚠ ${G.events.length} حدث ينتظر قرارك` : (G.research ? `بحث: ${M.TECHS[G.research.tech].name} ${Math.round(G.research.progress * 100)}%` : `${G.models.filter(m => !m.discontinued).length} موديل نشط`);
  const main = $('#main'); const scroll = main.scrollTop;
  main.innerHTML = ({ dash, design, models, factory, market, rnd, finance })[tab]();
  main.querySelectorAll('canvas.car[data-body]').forEach(cv => drawCar(cv, cv.dataset.body, cv.dataset.color, { label: cv.dataset.label }));
  if (tab === 'design') bindDesign();
  if (tab === 'dash') drawChart();
  main.scrollTop = tab === lastTab ? scroll : 0; lastTab = tab;
  if (G.events.length && !document.querySelector('.modal')) showEvent(G.events[0]);
}
let lastTab = null;

// ---------- DASHBOARD ----------
function dash() {
  const s = G.lastSummary; const val = M.companyValue(G);
  const active = G.models.filter(m => !m.discontinued);
  let h = '';
  if (G.gameOver) h += `<div class="card" style="border-color:var(--acc)"><h2>${G.gameOverReason === 'end' ? '🏁 انتهت الرحلة — 2030' : '💀 إفلاس'}</h2><div class="kv"><span>قيمة الشركة النهائية</span><b>${fm(val)}</b></div><div class="kv"><span>إجمالي السيارات المباعة</span><b>${fn(G.stats.totalSold)}</b></div><div class="kv"><span>موديلات أُطلقت</span><b>${G.stats.modelsLaunched}</b></div><div class="kv"><span>إنجازات</span><b>${G.achievements.length}/5</b></div><button class="pri" style="width:100%;margin-top:10px" onclick="location.reload()">لعبة جديدة</button></div>`;
  h += `<div class="card"><div class="grid3" style="text-align:center">
    <div><div class="muted">قيمة الشركة</div><b>${fm(val)}</b></div>
    <div><div class="muted">ربح آخر ربع</div><b class="${s && s.profit < 0 ? 'bad' : 'good'}">${s ? fm(s.profit) : '—'}</b></div>
    <div><div class="muted">مبيعات آخر ربع</div><b>${s ? fn(s.sold) : '—'}</b></div></div>

  if (s) h += `<div class="card"><h3>📋 تقرير Q${s.quarter} ${s.year}</h3><table class="summary">
    <tr><td>الإيرادات</td><td class="good">${fm(s.revenue)}</td></tr>
    <tr><td>تكلفة الإنتاج</td><td class="bad">${fm(-(s.costs - Object.values(s.fixedBreakdown).reduce((a, b) => a + b, 0)))}</td></tr>
    <tr><td>المصانع (ثابت)</td><td class="bad">${fm(-s.fixedBreakdown.factories)}</td></tr>
    <tr><td>رواتب</td><td class="bad">${fm(-s.fixedBreakdown.salaries)}</td></tr>

    ${s.fixedBreakdown.racing ? `<tr><td>فريق السباق</td><td class="bad">${fm(-s.fixedBreakdown.racing)}</td></tr>` : ''}
    ${s.fixedBreakdown.loans ? `<tr><td>أقساط قروض</td><td class="bad">${fm(-s.fixedBreakdown.loans)}</td></tr>` : ''}
    ${s.tax ? `<tr><td>ضرائب</td><td class="bad">${fm(-s.tax)}</td></tr>` : ''}
    <tr><td><b>صافي الربح</b></td><td><b class="${s.profit < 0 ? 'bad' : 'good'}">${fm(s.profit)}</b></td></tr></table>
    ${s.notes.map(n => `<div class="muted">• ${n}</div>`).join('')}</div>`;
  if (!active.length && !G.gameOver) h += `<div class="card" style="border-color:var(--acc)">⚠️ ليس لديك أي موديل في الإنتاج! انتقل إلى <b>تصميم</b> لصنع سيارتك الأولى.</div>`;
  h += `<div class="card"><h3>🚗 الموديلات النشطة</h3>${active.length ? active.map(m => `<div class="kv"><span>${esc(m.name)} <span class="pill">${M.BODIES[m.design.body].name}</span></span><span>${fn(m.lastSales)} مبيعة ${m.demandLast > m.capLast ? '<span class="acc">📈 الطلب أعلى!</span>' : ''} <b class="${m.lastProfit < 0 ? 'bad' : 'good'}">${fm(m.lastProfit)}</b></span></div>`).join('') : '<div class="muted">لا يوجد</div>'}</div>`;
  h += `<div class="card"><h3>📰 الأخبار</h3>${G.news.slice(0, 12).map(n => `<div class="news ${n.type}"><span class="muted">Q${n.quarter} ${n.year}</span> — ${n.text}</div>`).join('')}</div>`;
  if (G.achievements.length) h += `<div class="card"><h3>🏅 الإنجازات</h3>${G.achievements.map(a => `<span class="tag on">${a.name}</span>`).join('')}</div>`;
  return h;
}
function drawChart() {
  const cv = $('#chart'); if (!cv) return; const W = cv.width = cv.clientWidth * 2, H = cv.height = 240; const c = cv.getContext('2d');
  const d = G.history.slice(-40).map(x => x.profit); if (d.length < 2) { c.fillStyle = '#8a97a8'; c.font = '24px sans-serif'; c.textAlign = 'center'; c.fillText('البيانات تظهر بعد أول ربع', W / 2, H / 2); return; }
  const mx = Math.max(1, ...d.map(Math.abs)); const zero = H / 2;
  c.strokeStyle = '#2c3644'; c.beginPath(); c.moveTo(0, zero); c.lineTo(W, zero); c.stroke();
  const bw = W / d.length;
  d.forEach((v, i) => { const hgt = v / mx * (H / 2 - 10); c.fillStyle = v >= 0 ? '#37c871' : '#ef5350'; c.fillRect(i * bw + 2, v >= 0 ? zero - hgt : zero, bw - 4, Math.abs(hgt)); });
}

    <div class="row" style="margin-top:8px">
      <button class="sm" onclick="act(M.expandFactory(G,${f.id}),'تمت إضافة خط إنتاج')" ${f.lines >= 8 ? 'disabled' : ''}>➕ خط إنتاج<br><span class="muted">${fm(1_500_000 * infl)}</span></button>
      <button class="sm" onclick="act(M.upgradeAutomation(G,${f.id}),'تمت الأتمتة')" ${f.automation >= maxA ? 'disabled' : ''}>🤖 أتمتة<br><span class="muted">${f.automation >= maxA ? (maxA === 1 ? 'يحتاج بحث الروبوتات' : 'الأقصى') : fm(1_000_000 * (f.automation + 1) * f.lines * 0.5 * infl)}</span></button>
    </div></div>`; }).join('');
  h += `<div class="card"><h3>🏗 بناء مصنع جديد</h3><div class="muted">الإنتاج داخل منطقة البيع يوفر تكلفة الشحن ($${fn(250 * infl)}/سيارة).</div><div class="grid2" style="margin-top:8px">${Object.keys(M.REGIONS).map(r => { const cost = 3_000_000 * infl * (M.REGIONS[r].income < 0.7 ? 0.7 : 1); return `<button class="sm" onclick="act(M.buildFactory(G,'${r}'))">${M.REGIONS[r].name}<br><span class="muted">${fm(cost)}</span></button>`; }).join('')}</div></div>`;
  return h;
}

// ---------- MARKET ----------
function market() {
  const rep = M.marketReport(G); const infl = M.inflation(G.year);
  G.marketingFocus = G.marketingFocus || {};
  let h = `<h2>🌍 السوق العالمي</h2><div class="card"><div class="kv"><span>سعر الوقود</span><b class="${G.fuelPrice > 1.4 ? 'bad' : ''}">${G.fuelPrice > 1.4 ? '🔥 مرتفع' : G.fuelPrice > 1.15 ? 'أعلى من المعتاد' : 'طبيعي'} (${G.fuelPrice.toFixed(2)}x)</b></div><div class="kv"><span>الاقتصاد</span><b class="${G.recession ? 'bad' : 'good'}">${G.recession ? `ركود (${G.recession} أرباع)` : 'نمو'}</b></div>
  <div class="kv"><span>فريق التسويق</span><b>${G.marketers} موظف</b></div><div class="row"><button class="sm" onclick="act(M.hire(G,'marketers',5))">+5 مسوّق</button><button class="sm" onclick="act(M.hire(G,'marketers',-5))">-5</button></div><div class="muted">راتب المسوّق ${fm(4500 * infl)}/ربع. كل ما زاد الفريق، زادت فعالية الحملات.</div></div>`;
  h += Object.entries(rep).map(([r, R]) => `<div class="card"><div class="row"><b>${R.name}</b><span style="text-align:left" class="muted">دخل ${R.income}x</span></div>
    <div class="kv"><span>حجم السوق/ربع</span><b>${fn(R.demand)} سيارة</b></div>
    <div class="kv"><span>انتشار ماركتك</span><b>${Math.round(R.awareness * 100)}%</b></div><div class="bar"><i style="width:${R.awareness * 100}%"></i></div>
    <div style="margin:8px 0"><span class="muted">يهتمون بـ:</span> ${R.wants.map(w => `<span class="tag on">${STAT_LABELS[w]}</span>`).join('')}</div>
    <div class="muted">الفئات الأكثر طلباً:</div><div>${Object.entries(R.segs).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([s, v]) => `<span class="tag">${M.SEG_NAMES[s]} ${Math.round(v * 100)}%</span>`).join('')}</div>
    <div style="margin-top:8px"><span class="muted">حملة إعلانية:</span><div class="seg" style="margin-top:4px">${[0, 1, 2, 3].map(l => `<button class="${(G.marketingFocus[r] || 0) === l ? 'on' : ''}" onclick="act(M.setMarketing(G,'${r}',${l}))">${['لا', 'خفيفة', 'متوسطة', 'مكثفة'][l]}${l ? `<br><span class="muted" style="font-size:10px">${fm(l * 150000 * infl * (M.REGIONS[r].demand / 500000))}</span>` : ''}</button>`).join('')}</div></div>
  </div>`).join('');
  h += `<div class="card"><h3>🏁 المنافسون</h3>${G.competitors.map(c => `<details><summary><b>${c.name}</b> <span class="muted">سمعة ${Math.round(c.brand)} • ${c.models.length} موديل</span></summary>${c.models.map(m => `<div class="kv"><span>${m.name} <span class="pill">${M.SEG_NAMES[m.spec.seg]}${m.spec.ev ? ' ⚡' : ''}</span></span><b>$${fn(m.price)}</b></div>`).join('')}</details>`).join('')}</div>`;
  h += `<div class="card"><h3>🏎 فريق السباقات</h3><div class="muted">الفوز بالسباقات يرفع السمعة والانتشار عالمياً. الفرصة تعتمد على أداء أفضل سياراتك والميزانية.</div>
    <div class="row" style="margin-top:8px"><button class="${G.racing.active ? 'pri' : ''}" onclick="act(M.setRacing(G,!G.racing.active,G.racing.budget||${Math.round(500000 * infl)}))">${G.racing.active ? '✅ الفريق نشط' : 'تأسيس فريق'}</button></div>
    ${G.racing.active ? `<div class="row" style="margin-top:6px"><span class="muted">ميزانية/ربع</span><b style="text-align:left">${fm(G.racing.budget)}</b></div><input type="range" min="${Math.round(100000 * infl)}" max="${Math.round(5000000 * infl)}" step="${Math.round(50000 * infl)}" value="${G.racing.budget}" onchange="act(M.setRacing(G,true,+this.value))"><div class="kv"><span>بطولات محققة</span><b>🏆 ${G.racing.wins}</b></div>` : ''}</div>`;
  return h;
}

// ---------- R&D ----------
function rnd() {
  const infl = M.inflation(G.year);
  let h = `<h2>🔬 البحث والتطوير</h2><div class="card"><div class="kv"><span>المهندسون</span><b>${G.engineers}</b></div><div class="row"><button class="sm" onclick="act(M.hire(G,'engineers',5))">+5 مهندس</button><button class="sm" onclick="act(M.hire(G,'engineers',-5))">-5</button></div><div class="muted">راتب المهندس ${fm(6000 * infl)}/ربع. سرعة البحث = ${Math.min(3, Math.max(0.4, G.engineers / 20)).toFixed(1)}x</div>
  ${G.research ? `<div style="margin-top:10px"><b>قيد البحث: ${M.TECHS[G.research.tech].name}</b><div class="bar" style="margin-top:4px"><i style="width:${G.research.progress * 100}%;background:var(--acc)"></i></div><div class="muted">${Math.round(G.research.progress * 100)}% — يمكنك التبديل لبحث آخر (تخسر التقدم)</div></div>` : '<div class="acc" style="margin-top:8px">لا يوجد بحث جارٍ — اختر تقنية!</div>'}</div>`;
  const list = Object.entries(M.TECHS).sort((a, b) => a[1].year - b[1].year);
  h += list.map(([id, t]) => { const done = G.techs.includes(id); const early = G.year < t.year; const missing = t.req.filter(r => !G.techs.includes(r)); const locked = early || missing.length; const activeR = G.research && G.research.tech === id; const cost = t.cost * infl * 0.5; return `<div class="tech ${done ? 'done' : locked ? 'locked' : ''} ${activeR ? 'active' : ''}">
    <div class="row"><b>${done ? '✅ ' : ''}${t.name}</b><span class="muted" style="text-align:left">${t.year}+</span></div><div class="muted">${t.desc}</div>
    ${done ? '' : `<div class="row" style="margin-top:6px"><span class="muted">${fm(cost)} مقدماً + مثلها خلال ~${t.turns} أرباع${missing.length ? `<br>يتطلب: ${missing.map(r => M.TECHS[r].name).join('، ')}` : ''}${early ? `<br>متاح من ${t.year}` : ''}</span>${!locked && !activeR ? `<button class="blue sm" style="flex:0 0 auto" onclick="act(M.startResearch(G,'${id}'),'بدأ البحث')">ابدأ</button>` : ''}</div>`}</div>`; }).join('');
  return h;
}

// ---------- FINANCE ----------
function finance() {
  const infl = M.inflation(G.year); const val = M.companyValue(G); const debt = G.loans.reduce((s, l) => s + l.balance, 0);
  const maxLoan = Math.max(0, val * 0.8 + 2_000_000 * infl - debt);
  const hist = G.history.slice(-8).reverse();
  return `<h2>🏦 المالية</h2><div class="card">
    <div class="kv"><span>السيولة</span><b class="${G.cash < 0 ? 'bad' : ''}">${fm(G.cash)}</b></div>
    <div class="kv"><span>قيمة الشركة</span><b>${fm(val)}</b></div>
    <div class="kv"><span>إجمالي الديون</span><b class="${debt ? 'bad' : ''}">${fm(debt)}</b></div>
    <div class="kv"><span>السمعة</span><b>${Math.round(G.brand)}/100</b></div>
    <div class="kv"><span>إجمالي المبيعات التاريخية</span><b>${fn(G.stats.totalSold)}</b></div>
    <div class="kv"><span>أفضل ربع</span><b class="good">${fm(G.stats.bestQuarter)}</b></div>
    ${G.negativeTurns ? `<div class="news bad">⚠️ تحذير إفلاس: ${3 - G.negativeTurns} أرباع متبقية لتصحيح الوضع!</div>` : ''}
  </div>
  <div class="card"><h3>💳 القروض</h3><div class="muted">الحد المتاح: ${fm(maxLoan)} — تسدَّد على 5 سنوات.</div>
    <div class="grid3" style="margin-top:8px">${[1, 5, 20].map(m => `<button class="sm" onclick="act(M.takeLoan(G,${m * 1_000_000 * infl}))" ${maxLoan < m * 1e6 * infl ? 'disabled' : ''}>اقتراض<br>${fm(m * 1e6 * infl)}</button>`).join('')}</div>
    ${G.loans.map(l => `<div class="kv"><span>قرض: ${fm(l.balance)} <span class="muted">(${(l.rate * 400).toFixed(1)}% • ${l.turnsLeft} ربع)</span></span><button class="sm" onclick="act(M.repayLoan(G,${l.id}),'تم السداد')" ${G.cash < l.balance ? 'disabled' : ''}>سداد كامل</button></div>`).join('')}
  </div>
  <div class="card"><h3>📜 السجل</h3><table><tr><th>الفترة</th><th>مبيعات</th><th>ربح</th><th>سيولة</th></tr>${hist.map(x => `<tr><td>Q${x.q} ${x.y}</td><td>${fn(x.sold)}</td><td class="${x.profit < 0 ? 'bad' : 'good'}">${fm(x.profit)}</td><td>${fm(x.cash)}</td></tr>`).join('')}</table></div>
  <div class="card"><h3>⚙️ إدارة</h3><div class="row"><button class="sm" onclick="save();toast('تم الحفظ')">💾 حفظ</button><button class="sm" onclick="showLeaderboard()">🏆 المتصدرون</button><button class="danger sm" onclick="modal({title:'بدء لعبة جديدة؟',text:'سيتم حذف الشركة الحالية.',choices:[{label:'نعم',cls:'danger',fn:()=>{localStorage.removeItem(SAVE_KEY);location.reload()}},{label:'إلغاء'}]})">🗑 لعبة جديدة</button></div><div class="muted" style="margin-top:6px">معرفك: ${playerId.slice(-6)}</div></div>`;
}

// ---------- EVENTS & TURN ----------
function showEvent(ev) { modal({ title: '📢 ' + ev.title, text: ev.text, choices: ev.choices.map((c, i) => ({ label: c.label, cls: i === 0 ? 'pri' : '', fn: () => { M.resolveEvent(G, ev.id, i); save(); render(); } })) }); }
function doEndTurn() {
  if (G.events.length) { showEvent(G.events[0]); return; }
  const active = G.models.filter(m => !m.discontinued);
  const producing = G.factories.some(f => f.assigned != null);
  const go = () => { const r = M.endTurn(G); if (!r.ok) { toast(r.error); return; } save(); tab = 'dash'; render(); const s = r.summary; if (s.sold || s.profit) toast(`${s.profit >= 0 ? '📈' : '📉'} Q${s.quarter} ${s.year}: ${fn(s.sold)} مبيعة، ربح ${fm(s.profit)}`); if (G.gameOver) setTimeout(() => modal({ title: G.gameOverReason === 'end' ? '🏁 2030 — النهاية' : '💀 إفلاس', text: G.gameOverReason === 'end' ? `أنهيت 70 سنة من الصناعة! قيمة شركتك النهائية <b>${fm(M.companyValue(G))}</b> وبعت ${fn(G.stats.totalSold)} سيارة.` : `نفدت السيولة ورفض البنك إنقاذك. صمدت حتى ${G.year}. حاول مجدداً — قلّل التكاليف الثابتة وسعّر بذكاء.`, choices: [{ label: 'عرض النتائج' }] }), 400); };
  if (active.length && !producing) modal({ title: 'لا يوجد إنتاج!', text: 'لديك موديلات لكن لا مصنع يعمل عليها. تريد المتابعة بدون مبيعات؟', choices: [{ label: 'تعيين المصانع', fn: () => { tab = 'factory'; render(); } }, { label: 'متابعة بدون إنتاج', cls: 'danger', fn: go }] });
  else go();
}
document.addEventListener('keydown', e => { if (e.key === 'Enter' && G && !document.querySelector('.modal') && document.activeElement.tagName !== 'INPUT') doEndTurn(); });
</script>
</body>
</html>
