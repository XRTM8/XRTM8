# NEON CLASH: OVERDRIVE — Render Deployment Blueprint
# Deploy: Render Dashboard → New → Blueprint (or connect this repo directly).
# Static sites on Render free plan never sleep and get automatic HTTPS.

services:
  - type: web
    name: neon-clash-overdrive
    runtime: static
    buildCommand: echo "Static assets ready"
    staticPublishPath: .
    envVars:
      - key: SKIP_INSTALL_DEPS
        value: "true"
    routes:
      # SPA fallback for deep links (e.g. /?room=ABCD)
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Game assets: cached for performance
      - path: /js/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /css/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /icons/*
        name: Cache-Control
        value: public, max-age=2592000
      # Service worker & manifest must revalidate immediately
      - path: /service-worker.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
